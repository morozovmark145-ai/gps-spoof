name: GPSSpoof
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  GPSSpoof:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.gpsspoof
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor
        OTHER_LDFLAGS: -lidevice_ffi -lc++ -lresolv -framework Security -framework SystemConfiguration -framework CoreFoundation
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GPS Spoof
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Нужно, чтобы приложение работало в фоне и держало подмену.
        NSLocationAlwaysAndWhenInUseUsageDescription: Нужно, чтобы приложение работало в фоне и держало подмену.
        UIBackgroundModes: [location]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pairing File
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.property-list, com.apple.xml-property-list, public.data]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
